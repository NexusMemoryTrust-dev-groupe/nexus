[package]
name = "nexus"
version = "1.0.0"
edition = "2024"
description = "Nexus Memory Trust — AI Memory Operating System"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# Database
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Semantic embeddings
fastembed = "5"
tokenizers = { version = "0.22.2", features = ["onig"], default-features = false }

# System dirs
dirs = "6"

# Cryptography
ring = "0.17.14"
argon2 = "0.5.3"

# HTTP client for AI API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Tauri
tauri = { version = "2.11.5", features = ["default"] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
mockall = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "semantic_search"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
