[package]
name = "nexus"
version = "1.2.0"
edition = "2024"
description = "Nexus Memory Trust — AI Memory Operating System"
default-run = "nexus"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# Database
# `backup` enables the SQLite Online Backup API (consistent snapshot even under
# WAL with concurrent writers — used by the backup/restore subsystem).
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }

# Semantic embeddings
fastembed = "5"
tokenizers = { version = "0.22.2", features = ["onig"], default-features = false }

# Exact token counting for OpenAI/GPT-family models (embedded BPE vocabularies)
tiktoken-rs = "0.12"

# System dirs
dirs = "6"

# Cryptography
ring = "0.17.14"
argon2 = "0.5.3"

# URL parsing — updater channel endpoints (plan 7.2)
url = "2"

# Tauri
tauri = { version = "2.11.5", features = ["default"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
mockall = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3"
# Property-based testing (plan 8.2): memory states, graph edges, UTF-8, paths,
# migration sequences — DB consistency under arbitrary transitions.
proptest = "1"

[[bench]]
name = "semantic_search"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
