name: Release

# Builds the Windows installers and publishes them with a checksum file.
#
# Why this shape
# --------------
# The npm postinstall script and the PowerShell installer download an asset
# matched by `setup` + architecture. Two steps keep that contract honest:
#   1. `Collect artifacts` asserts, before publishing, that the filenames the
#      installers look for are the filenames the bundler actually produced.
#   2. `SHA256SUMS.txt` is generated so both installers can verify downloads
#      instead of trusting the network.
#
# Paths are relative to the repository root, which *is* the app directory:
# `package.json`, `src-tauri/` and `npm-package/` all sit at the top level.
# An earlier version of this file prefixed everything with `nexus/`, so
# `actions/setup-node` could not find the lock file and the whole run died at
# "Some specified paths were not resolved, unable to cache dependencies."
#
# Architectures: x64 and ARM64. 32-bit (i686) is deliberately absent — the ONNX
# runtime behind semantic search publishes no i686 binaries (`ort-sys` fails the
# build outright), and Windows 11 has no 32-bit edition.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish into (e.g. v1.0.0). Leave empty to build only.'
        type: string
        default: ''
      dry_run:
        description: 'Build installers without publishing a release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The release this run belongs to. A tag push supplies it through `ref_name`;
  # a manual run supplies it through the `tag` input.
  #
  # Why the input exists: `workflow_dispatch` runs the workflow file *as it
  # exists at the chosen ref*. Dispatching at an old tag would therefore re-run
  # whatever release.yml that tag was cut with — including a broken one. Running
  # from the default branch and naming the tag explicitly adds assets to an
  # existing release without rewriting history.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── Gate: the code must be sound before we spend time on installers ───────
  verify:
    name: Tests and type check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test -- --run

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      # `-D warnings` is applied here via `--` so it scopes to our crate only.
      # Setting RUSTFLAGS globally would also promote warnings inside third-party
      # dependencies, letting an unrelated upstream release break our releases.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --all-targets
        working-directory: src-tauri

      - name: Installer scripts parse
        shell: pwsh
        run: |
          # These files are shipped to users inside the npm package and run on
          # their machines. A syntax error here would only surface after install.
          foreach ($f in @(
            'npm-package/bin/nexus.js',
            'npm-package/index.js',
            'npm-package/scripts/postinstall.js',
            'npm-package/scripts/nexus-install-lib.js'
          )) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "$f failed to parse" }
            Write-Host "  OK $f"
          }

      - name: Installer library unit tests
        shell: pwsh
        run: |
          # Asset-name resolution lives here. If it regresses, every `npm
          # install -g nexus-memory-trust` 404s, so it is gated before release.
          node npm-package/scripts/nexus-install-lib.test.js

      - name: Version consistency
        shell: pwsh
        run: |
          # A version mismatch silently produces installers whose filenames do
          # not match what the download scripts expect.
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $front = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $npm   = (Get-Content npm-package/package.json -Raw | ConvertFrom-Json).version
          $cargo = ((Get-Content src-tauri/Cargo.toml) -match '^version\s*=' |
                    Select-Object -First 1) -replace '.*"(.*)".*', '$1'

          Write-Host "  tauri.conf.json      : $tauri"
          Write-Host "  package.json         : $front"
          Write-Host "  npm-package/package  : $npm"
          Write-Host "  Cargo.toml           : $cargo"

          $all = @($tauri, $front, $npm, $cargo) | Select-Object -Unique
          if ($all.Count -ne 1) { throw "Version mismatch across manifests: $($all -join ', ')" }

          # $env:TAG is the tag this run publishes into — from the ref on a tag
          # push, from the `tag` input on a manual run. Empty means build-only.
          if ($env:TAG -like 'v*') {
            $tag = $env:TAG -replace '^v', ''
            if ($tag -ne $tauri) { throw "Tag $env:TAG does not match version $tauri" }
            Write-Host "  tag matches version"
          } else {
            Write-Host "  no release tag for this run — skipping tag check"
          }

  # ── Build one installer per architecture ─────────────────────────────────
  build:
    name: Build ${{ matrix.arch }}
    needs: verify
    runs-on: windows-latest
    # The updater needs every installer signed. Tauri signs automatically when
    # the private key is present; without it the build produces no `.sig` and
    # the publish job fails loudly rather than shipping an app that cannot
    # update itself. `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` stays empty for a
    # password-less key (generated with `tauri signer generate --ci`).
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build installers
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis,msi

      - name: Collect artifacts
        id: collect
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $out = "artifacts"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $found = @()
          foreach ($pattern in @("$bundle/nsis/*-setup.exe", "$bundle/nsis/*-setup.exe.sig", "$bundle/msi/*.msi")) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination $out
              $found += $_.Name
              Write-Host ("  {0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
            }
          }

          if ($found.Count -eq 0) { throw "No installers were produced for ${{ matrix.arch }}" }

          # The download scripts match on `setup` + arch, so an NSIS installer
          # must exist and must carry the architecture in its name.
          $setup = $found | Where-Object { $_ -like '*setup*.exe' }
          if (-not $setup) { throw "NSIS installer missing for ${{ matrix.arch }}" }
          if ($setup -notmatch '${{ matrix.arch }}') {
            throw "Installer '$setup' does not contain '${{ matrix.arch }}' — the download scripts will not find it"
          }
          Write-Host "  asset name check passed: $setup"

          # The updater needs the signature next to the installer. A missing
          # `.sig` means the key was absent from the environment, and the app
          # would be released without the ability to update itself.
          $sig = $found | Where-Object { $_ -like '*.sig' }
          if (-not $sig) { throw "No .sig signature produced for ${{ matrix.arch }} — set TAURI_SIGNING_PRIVATE_KEY" }
          Write-Host "  signature present: $sig"

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  # ── Publish: checksums first, then a single release with every asset ──────
  publish:
    name: Publish release
    needs: build
    # Tag pushes always publish. A manual run publishes only when it both names
    # a tag and explicitly clears dry_run, so the default dispatch builds and
    # uploads artifacts without touching any release.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (inputs.tag != '' && inputs.dry_run != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: staging
          pattern: installers-*
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd staging
          ls -la
          # Both installers verify downloads against this file; the format is the
          # plain `sha256sum` output they already know how to parse.
          sha256sum * > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Verify the download scripts can resolve these assets
        run: |
          cd staging
          # Final guard against a 404 on install: prove an x64 and an ARM64 setup
          # executable are both present and discoverable by the same substring
          # match the installers use.
          for arch in x64 arm64; do
            if ! ls | grep -i "setup" | grep -qi "$arch"; then
              echo "No installer discoverable for $arch"
              ls
              exit 1
            fi
            echo "  $arch installer present"
          done

      - name: Generate updater manifest (latest.json)
        run: |
          cd staging
          VERSION="${TAG#v}"
          # The app's updater endpoint is
          # `.../releases/latest/download/latest.json`, so this manifest must be
          # attached to every release or the installed app cannot find updates.
          x64_setup=$(ls | grep -i "x64.*setup.*\.exe$" | head -1)
          arm64_setup=$(ls | grep -i "arm64.*setup.*\.exe$" | head -1)
          x64_sig=$(ls | grep -i "x64.*setup.*\.exe\.sig$" | head -1)
          arm64_sig=$(ls | grep -i "arm64.*setup.*\.exe\.sig$" | head -1)

          if [ -z "$x64_setup" ] || [ -z "$arm64_setup" ]; then
            echo "Missing installers for the updater manifest"; ls; exit 1
          fi
          if [ -z "$x64_sig" ] || [ -z "$arm64_sig" ]; then
            echo "Missing signatures for the updater manifest"; ls; exit 1
          fi

          BASE="https://github.com/NexusMemoryTrust-dev-groupe/nexus/releases/download/${TAG}"

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Nexus Memory Trust $TAG — auto-update release.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat "$x64_sig")",
                "url": "$BASE/$x64_setup"
              },
              "windows-aarch64": {
                "signature": "$(cat "$arm64_sig")",
                "url": "$BASE/$arm64_setup"
              }
            }
          }
          EOF
          echo "--- latest.json ---"
          cat latest.json

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: Nexus Memory Trust ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          # Left published on purpose: re-running this workflow on an existing
          # tag (for example to add a missing ARM64 asset) must not flip an
          # already-published release back to draft.
          draft: false
          files: staging/*
          body: |
            ## Nexus Memory Trust ${{ env.TAG }}

            An AI memory operating system: your knowledge graph, your memory,
            your machine.

            ### Install

            **Installer (recommended)** — download the file for your machine and
            run it. You can choose the install location, including another drive,
            and pick English or Russian during setup.

            | Your machine | Download |
            |---|---|
            | Windows 10/11, Intel or AMD | `Nexus_*_x64-setup.exe` |
            | Windows 11 on ARM (Surface, Snapdragon) | `Nexus_*_arm64-setup.exe` |

            **npm** — if you prefer the terminal:

            ```
            npm install -g nexus-memory-trust
            nexus
            ```

            `.msi` builds are also attached for managed deployments.

            ### Auto-updates

            Installed apps check GitHub Releases for updates and silently
            install new versions in the background. `latest.json` (signed with
            the project's updater key) points the app at the newest installer
            for your architecture.

            ### First run

            A setup wizard checks Node.js and the OpenCode CLI, helps you add an
            API key (a free model is available), and registers Nexus with
            OpenCode so any AI assistant can use your memory. Nothing leaves your
            machine except the requests you send to your chosen model.

            ### Verify your download

            `SHA256SUMS.txt` is attached. On Windows:

            ```
            Get-FileHash .\Nexus_*_x64-setup.exe -Algorithm SHA256
            ```

            ### Requirements

            - Windows 10 version 1809 or newer, or Windows 11 (64-bit)
            - WebView2 — installed automatically if missing

            32-bit Windows is not supported: the ONNX runtime used for semantic
            search ships no 32-bit build.
