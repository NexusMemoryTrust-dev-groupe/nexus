name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: nexus

      - name: Build frontend
        run: npm run build
        working-directory: nexus

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Memory Trust ${{ github.ref_name }}'
          releaseBody: |
            Nexus Memory Trust — AI Memory Operating System
            
            ## Installation
            1. Download `Nexus-Setup-x64.exe` below
            2. Run the installer
            3. Follow the first-run setup wizard
            
            ## Requirements
            - Windows 10/11 (64-bit)
            - Internet connection for AI features (optional)
          releaseDraft: true
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexus/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexus/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: nexus

      - name: Build frontend
        run: npm run build
        working-directory: nexus

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: --target x86_64-unknown-linux-gnu
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Memory Trust ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
